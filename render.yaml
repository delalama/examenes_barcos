services:
  - type: web
    name: nautical-exams-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nautical-exams-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: nautical-exams-db
    databaseName: nautical
    user: nautical
